{% extends "base.html" %}
{% block title %}{{ '编辑' if project else '新建' }}项目 - Build Manager{% endblock %}
{% block content %}
<div class="d-flex align-items-center mb-3">
    <h2 class="mb-0">{{ '编辑' if project else '新建' }}项目</h2>
    <span class="text-muted ms-2 small">{{ '修改项目配置' if project else '添加一个新的构建项目' }}</span>
</div>
<form method="post" class="mt-2">
    <div class="row g-3">
        <div class="col-md-6">
            <div class="card"><div class="card-header">基本信息</div><div class="card-body">
            <div class="mb-2">
                <label class="form-label">项目名称 <span class="text-danger">*</span></label>
                <input type="text" name="name" class="form-control" required value="{{ project.name if project else '' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">描述</label>
                <textarea name="description" class="form-control" rows="2">{{ project.description if project else '' }}</textarea>
            </div>
            <div class="mb-2">
                <label class="form-label">项目根目录 <span class="text-danger">*</span></label>
                <input type="text" name="project_root" class="form-control font-monospace" required value="{{ project.project_root if project else '' }}" placeholder="E:\project\my-app">
            </div>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-header">Maven 配置</div><div class="card-body">
            <div class="mb-2">
                <label class="form-label">Maven 命令路径</label>
                <input type="text" name="maven_command" class="form-control font-monospace" value="{{ project.maven_command if project else 'C:\\tools\\maven\\apache-maven-3.8.1\\bin\\mvn.cmd' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">Maven Settings 路径</label>
                <input type="text" name="maven_settings" class="form-control font-monospace" value="{{ project.maven_settings if project else 'C:\\tools\\maven\\conf\\settings.xml' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">JAVA_HOME (JDK 21)</label>
                <input type="text" name="maven_java_home" class="form-control font-monospace" value="{{ project.maven_java_home if project else 'C:\\tools\\jdk\\corretto-21.0.10' }}">
            </div>
            <div class="row g-2">
                <div class="col">
                    <label class="form-label">Maven Profile</label>
                    <input type="text" name="maven_profile" class="form-control" value="{{ project.maven_profile if project else '' }}">
                </div>
                <div class="col-auto d-flex align-items-end gap-2 pb-2">
                    <div class="form-check">
                        <input type="checkbox" name="maven_offline" class="form-check-input" value="1" {{ 'checked' if project and project.maven_offline }}>
                        <label class="form-check-label">离线</label>
                    </div>
                    <div class="form-check">
                        <input type="checkbox" name="skip_maven" class="form-check-input" value="1" {{ 'checked' if project and project.skip_maven }}>
                        <label class="form-check-label">跳过</label>
                    </div>
                </div>
            </div>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-header">Docker 配置</div><div class="card-body">
            <div class="mb-2">
                <label class="form-label">Dockerfile 目录</label>
                <input type="text" name="dockerfile_dir" class="form-control font-monospace" value="{{ project.dockerfile_dir if project else 'docker' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">Dockerfile 文件名</label>
                <input type="text" name="dockerfile_name" class="form-control font-monospace" value="{{ project.dockerfile_name if project else 'DockerfileH' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">镜像标签前缀</label>
                <input type="text" name="image_tag_prefix" class="form-control font-monospace" value="{{ project.image_tag_prefix if project else 'registry.example.com/my-project/' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">镜像标签后缀</label>
                <input type="text" name="image_tag_suffix" class="form-control" value="{{ project.image_tag_suffix if project else '' }}" placeholder="例: equipment-biz/">
            </div>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-header">输出 & 高级</div><div class="card-body">
            <div class="mb-2">
                <label class="form-label">输出目录</label>
                <input type="text" name="output_dir" class="form-control font-monospace" value="{{ project.output_dir if project else 'docker/output' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">压缩方式</label>
                <select name="compress" class="form-select">
                    <option value="Gzip" {{ 'selected' if not project or project.compress == 'Gzip' }}>Gzip (tar.gz)</option>
                    <option value="None" {{ 'selected' if project and project.compress == 'None' }}>无压缩 (tar)</option>
                </select>
            </div>
            <div class="d-flex gap-3 pt-2">
                <div class="form-check">
                    <input type="checkbox" name="no_cache" class="form-check-input" value="1" {{ 'checked' if project and project.no_cache }}>
                    <label class="form-check-label">无缓存</label>
                </div>
                <div class="form-check">
                    <input type="checkbox" name="skip_save" class="form-check-input" value="1" {{ 'checked' if project and project.skip_save }}>
                    <label class="form-check-label">跳过保存</label>
                </div>
            </div>
            </div></div>
        </div>
        <div class="col-md-6">
            <div class="card"><div class="card-header">Portainer 配置</div><div class="card-body">
            <div class="mb-2">
                <label class="form-label">Portainer 地址</label>
                <input type="text" name="portainer_url" class="form-control font-monospace" value="{{ project.portainer_url if project else '' }}" placeholder="http://192.168.1.100:9000">
            </div>
            <div class="mb-2">
                <label class="form-label">认证用户名</label>
                <input type="text" name="portainer_username" class="form-control" value="{{ project.portainer_username if project else '' }}" placeholder="admin">
            </div>
            <div class="mb-2">
                <label class="form-label">认证密码</label>
                <input type="password" name="portainer_password" class="form-control" value="{{ project.portainer_password if project else '' }}">
            </div>
            <div class="mb-2">
                <label class="form-label">Environment ID</label>
                <input type="text" name="portainer_environment_id" class="form-control" value="{{ project.portainer_environment_id if project else '' }}" placeholder="1">
            </div>
            <div class="mb-2">
                <label class="form-label">容器名称</label>
                <input type="text" name="container_name" class="form-control" value="{{ project.container_name if project else '' }}" placeholder="例如: my-app-container">
            </div>
            </div></div>
        </div>
    </div>
    <div class="d-flex gap-2 mt-3 mb-4">
        <button type="submit" class="btn btn-primary px-3">{{ '保存' if project else '创建' }}</button>
        <a href="/projects" class="btn btn-outline-secondary px-3">取消</a>
    </div>
</form>
{% endblock %}
